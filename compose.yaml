services:
  api:
    build:
      context: ./api
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./api
    env_file: .env
    command: ["python", "worker.py"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: ./api
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    profiles: ["ops"]
